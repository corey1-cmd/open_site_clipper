name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests api scripts
      - name: Format check (ruff)
        run: ruff format --check src tests api scripts
      - name: Test (pytest)
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfE 2>&1 | tee pytest.log
      - name: Show failing tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -20 | sed 's/^/::error::/' || true
          grep -E "^E  " pytest.log | head -20 | sed 's/^/::error::/' || true
      - name: Smoke test (CLI demo)
        run: |
          open_site_clipper --demo --format markdown | head -20
          open_site_clipper --list-sources
